services:
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - applogs:/var/log/app
    logging:
      driver: json-file

  redis:
    image: redis:7-alpine
    # No "ports" entry: Redis is reachable only from other services
    # on the compose network (the api service), not from the host.

volumes:
  applogs:
