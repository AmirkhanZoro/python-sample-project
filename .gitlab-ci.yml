stages:
  - lint
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_NAME: fastapi-redis

cache:
  paths:
    - .cache/pip

lint:
  stage: lint
  image: python:3.9
  script:
    - pip install flake8
    - flake8 .

build:
  stage: build
  image: docker:24
  services:
    - docker:dind
  script:
    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHA .
    - docker tag $IMAGE_NAME:$CI_COMMIT_SHA $IMAGE_NAME:latest

deploy:
  stage: deploy
  script:
    - docker-compose up -d
  when: manual